<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Name Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. Name field, a five-cell verdict strip, then one section per checklist item. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #131a2b;
  --muted: #5b6478;
  --line: #d9dee8;
  --accent: #2f3fbf;
  --accent-ink: #ffffff;
  --ok: #107a4d;      --ok-bg: #dff3e8;
  --bad: #b3261e;     --bad-bg: #fbe3e0;
  --warn: #8a5a00;    --warn-bg: #fcefc9;
  --idle: #4b5468;    --idle-bg: #e6e9f0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e121b;
    --surface: #171c28;
    --ink: #e8ebf2;
    --muted: #9aa3b8;
    --line: #2b3243;
    --accent: #8f9bff;
    --accent-ink: #0e121b;
    --ok: #5fd39c;    --ok-bg: #143526;
    --bad: #ff8f86;   --bad-bg: #40191a;
    --warn: #f0c35a;  --warn-bg: #3a2d0c;
    --idle: #b3bbcc;  --idle-bg: #262d3c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--body);
}
.page {
  max-width: 820px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 40px 64px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
h1 {
  font: 700 clamp(28px, 6vw, 40px)/1.1 var(--display);
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  text-wrap: balance;
}
.lede { color: var(--muted); margin: 0; max-width: 60ch; }

form { display: flex; gap: 10px; flex-wrap: wrap; }
#name {
  flex: 1 1 240px;
  min-width: 0;
  font: 500 18px var(--body);
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
}
#go {
  font: 600 16px var(--body);
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 8px;
  padding: 12px 22px;
  cursor: pointer;
}
#go:disabled { opacity: 0.6; cursor: progress; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.recent { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
.recent button {
  font: 500 13px var(--body);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px 4px 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.dots { display: inline-flex; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--idle); }

.strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.strip a {
  padding: 12px 12px 14px;
  text-decoration: none;
  color: inherit;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.strip a:first-child { border-left: 0; }
.strip .label { font-size: 13px; font-weight: 500; color: var(--muted); }
@media (max-width: 620px) {
  .strip { grid-template-columns: 1fr; }
  .strip a { flex-direction: row; justify-content: space-between; align-items: center; border-left: 0; border-top: 1px solid var(--line); }
  .strip a:first-child { border-top: 0; }
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  font: 600 12px var(--body);
  letter-spacing: 0.02em;
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
  color: var(--idle);
  background: var(--idle-bg);
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-available { color: var(--ok); background: var(--ok-bg); }
.s-taken { color: var(--bad); background: var(--bad-bg); }
.s-caution { color: var(--warn); background: var(--warn-bg); }
.dots .s-available { background: var(--ok); }
.dots .s-taken { background: var(--bad); }
.dots .s-caution { background: var(--warn); }
.s-loading::before { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .s-loading::before { animation: none; } }

.checks { display: flex; flex-direction: column; gap: 14px; }
.check {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-margin-top: 16px;
}
.check header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.check h2 { font: 700 19px/1.2 var(--display); margin: 0; }
.finding { margin: 0; max-width: 65ch; }
.hint { margin: 0; color: var(--muted); font-size: 13px; max-width: 65ch; }
.rows { list-style: none; margin: 4px 0 0; padding: 0; border-top: 1px solid var(--line); }
.rows li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.rows .main { min-width: 0; overflow-wrap: anywhere; }
.rows .main a { color: var(--ink); font-weight: 500; text-decoration-color: var(--line); text-underline-offset: 3px; }
.rows .meta { display: block; color: var(--muted); font-size: 13px; }
.rows .mono { font-family: var(--mono); font-size: 14px; }
.more { align-self: flex-start; color: var(--accent); font-weight: 500; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="page">
  <div>
    <h1>Brand Name Check</h1>
    <p class="lede">Type a name you are considering. It is checked against Indian trademark filings, registered companies, domain names, social handles and the first page of web search.</p>
  </div>

  <form id="form">
    <input id="name" type="text" value="The Soil" maxlength="80" autocomplete="off" spellcheck="false" aria-label="Brand name">
    <button id="go" type="submit">Check name</button>
  </form>

  <div class="recent" id="recent" hidden></div>

  <nav class="strip" id="strip" aria-label="Summary"></nav>

  <div class="checks" id="checks"></div>
</div>

<script>
const CHECKS = [
  { id: "trademark", title: "Trademark", idle: "Searches trademark applications filed with IP India, through QuickCompany." },
  { id: "company", title: "Company registration", idle: "Searches companies registered with the Ministry of Corporate Affairs, through QuickCompany." },
  { id: "domains", title: "Domain name", idle: "Looks up .com, .in, .co.in and five other extensions at the domain registries." },
  { id: "social", title: "Social handles", idle: "Checks the handle on YouTube, X and LinkedIn. Instagram and Facebook need a manual look." },
  { id: "web", title: "Web search", idle: "Reads the first page of results for the exact name and counts who already uses it." },
];
const LABEL = {
  idle: "Not checked", loading: "Checking", available: "Available", taken: "Taken",
  caution: "Needs a look", manual: "Check by hand", unknown: "Could not check",
};
const ROW_LABEL = { ...LABEL, manual: "Open to check", unknown: "Unconfirmed" };

const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter((k) => k != null));
  return n;
}
const pill = (state, labels = LABEL) => el("span", { className: "pill s-" + state, textContent: labels[state] || state });
const out = (href, text, cls = "") => el("a", { href, target: "_blank", rel: "noopener", textContent: text, className: cls });

function row(main, meta, state, labels) {
  const left = el("span", { className: "main" }, main, meta ? el("span", { className: "meta", textContent: meta }) : null);
  return el("li", {}, left, state ? pill(state, labels) : null);
}

const ROWS = {
  trademark: (i) => row(out(i.url, i.name), [i.owner, i.klass && "Class " + i.klass, i.state, i.date].filter(Boolean).join(" · "),
    i.live ? (i.match === "exact" ? "taken" : "caution") : "idle", { taken: "Exact match", caution: "Similar", idle: "No longer live" }),
  company: (i) => row(out(i.url, i.name), [i.cin, i.state, i.date].filter(Boolean).join(" · "),
    i.live ? (i.match === "exact" ? "taken" : "caution") : "idle", { taken: "Exact match", caution: "Similar", idle: "Not active" }),
  domains: (i) => row(el("span", { className: "mono", textContent: i.domain }),
    i.via === "dns" ? "From DNS only. Confirm at the registrar." : "", i.state, ROW_LABEL),
  social: (i) => row(out(i.url, i.platform), i.handle, i.state, ROW_LABEL),
  web: (i) => row(out(i.url, i.title), i.host, i.uses ? "caution" : "idle", { caution: "Uses the name", idle: "Unrelated" }),
};
const MORE = { trademark: "Open this search on QuickCompany", company: "Open this search on QuickCompany", domains: "Search on GoDaddy", web: "Open this search on Google" };

function render(id, data) {
  const def = CHECKS.find((c) => c.id === id);
  const state = data ? data.verdict : "idle";
  const cell = el("a", { href: "#" + id }, el("span", { className: "label", textContent: def.title }), pill(state));
  $("strip-" + id).replaceWith(Object.assign(cell, { id: "strip-" + id }));

  const sec = el("section", { className: "check", id },
    el("header", {}, el("h2", { textContent: def.title }), pill(state)));
  if (!data || state === "loading") {
    sec.append(el("p", { className: "hint", textContent: def.idle }));
  } else {
    sec.append(el("p", { className: "finding", textContent: data.finding }));
    if (data.total > data.items.length)
      sec.append(el("p", { className: "hint", textContent: `Showing the closest ${data.items.length} of ${data.total.toLocaleString("en-IN")} loose matches.` }));
    if (data.items.length) sec.append(el("ul", { className: "rows" }, ...data.items.map(ROWS[id])));
    if (data.url) sec.append(out(data.url, MORE[id], "more"));
  }
  $(id).replaceWith(sec);
}

function loadRecent() {
  try { return JSON.parse(localStorage.getItem("recent") || "[]"); } catch { return []; }
}
function showRecent() {
  const list = loadRecent();
  const box = $("recent");
  box.hidden = !list.length;
  box.replaceChildren("Checked before:", ...list.map((r) => {
    const dots = el("span", { className: "dots" }, ...CHECKS.map((c) => el("i", { className: "s-" + r.v[c.id], title: c.title + ": " + LABEL[r.v[c.id]] })));
    const b = el("button", { type: "button" }, dots, r.name);
    b.onclick = () => { $("name").value = r.name; run(); };
    return b;
  }));
}
function saveRecent(name, v) {
  const list = loadRecent().filter((r) => r.name.toLowerCase() !== name.toLowerCase());
  list.unshift({ name, v });
  try { localStorage.setItem("recent", JSON.stringify(list.slice(0, 12))); } catch {}
  showRecent();
}

let runId = 0;
async function run() {
  const name = $("name").value.trim();
  if (name.replace(/[^a-z0-9]/gi, "").length < 2) { $("name").focus(); return; }
  const mine = ++runId;
  $("go").disabled = true;
  const verdicts = {};
  await Promise.all(CHECKS.map(async (c) => {
    render(c.id, { verdict: "loading" });
    let data;
    try {
      const res = await fetch(`/api/check?check=${c.id}&name=${encodeURIComponent(name)}`);
      data = await res.json();
      if (data.error) data = { verdict: "unknown", finding: data.error, items: [] };
    } catch {
      data = { verdict: "unknown", finding: "The checker is not running. Start it with: node server.js", items: [] };
    }
    if (mine !== runId) return;
    verdicts[c.id] = data.verdict;
    render(c.id, data);
  }));
  if (mine !== runId) return;
  $("go").disabled = false;
  saveRecent(name, verdicts);
}

$("strip").append(...CHECKS.map((c) => el("a", { id: "strip-" + c.id })));
$("checks").append(...CHECKS.map((c) => el("section", { id: c.id })));
CHECKS.forEach((c) => render(c.id));
showRecent();
$("form").addEventListener("submit", (e) => { e.preventDefault(); run(); });
</script>
</body>
</html>
